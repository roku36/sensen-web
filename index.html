<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensen</title>
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0b10; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; }
      /* Hide the native scrollbar on the timeline (still scrollable via wheel). */
      .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }

      /* ── 設計言語「居合」(docs/design-language.md) ──
         環境アニメーションループは置かない。動いてよいのは出来事だけ。
         書体: 見出し=明朝(極端なウェイト)、本文=sans、数値=mono。 */
      :root {
        --sumi: #0f0f11;       /* 地 */
        --sumi-2: #17171a;     /* 面 */
        --sumi-3: #222226;     /* 界線面 */
        --kami: #e8e4da;       /* 紙 */
        --shu: #e8472b;        /* 朱 — 時間と意思の刃。これ以外に使わない */
      }
      .mincho { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }

      /* Hand cards: 2px の浮きのみ。光らせない。 */
      .hand-card { transition: transform .12s ease; }
      .hand-card:hover:not(:disabled) { transform: translateY(-3px); }

      /* HP変化の数字ポップ (出来事駆動)。 */
      @keyframes dmg-pop {
        0%   { transform: translateY(0); opacity: 0; }
        12%  { transform: translateY(-2px); opacity: 1; }
        100% { transform: translateY(-26px); opacity: 0; }
      }
      .dmg-pop { animation: dmg-pop .9s ease-out forwards; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
